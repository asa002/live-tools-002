<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>集計ツール</title>
<style>
  :root {
    --bg: #f4f1fa;
    --card: #ffffff;
    --text: #2b2540;
    --muted: #7a7390;
    --plus: #4f8cff;
    --first: #35b88a;
    --love: #ff5fa2;
    --toutoi: #8a5cf5;
    --orange: #d9480f;
    --teal: #0e8a9a;
    --mark: #f59f00;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Meiryo", system-ui, sans-serif;
  }
  .app {
    width: min(100%, 560px);
    background: var(--card);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(60, 40, 110, .12);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }
  .topbar { flex-wrap: wrap; }
  .top-btns { display: flex; gap: 8px; }
  .status { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .status.warn { color: #e5484d; font-weight: 700; }
  .small-btn {
    background: #efeafb;
    color: var(--toutoi);
    padding: 10px 14px;
    font-size: 14px;
    border-radius: 10px;
  }
  .window {
    text-align: center;
    padding: 20px 10px 24px;
    border-radius: 14px;
    background: #faf8ff;
    border: 2px solid #e6e0f5;
    margin-bottom: 22px;
  }
  .window .label { font-size: 14px; color: var(--muted); letter-spacing: .1em; }
  .window .value {
    font-size: 64px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    transition: color .2s, transform .12s;
  }
  .window .value.negative { color: #e5484d; }
  .window .value.bump { transform: scale(1.08); }
  .window .bar { margin: 16px 14px 0; }
  .goal {
    background: #faf8ff;
    border: 2px solid #e6e0f5;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 22px;
  }
  .goal label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
  .goal input {
    width: 100%;
    font-size: 22px;
    font-weight: 700;
    padding: 8px 12px;
    border: 2px solid #d9d2ee;
    border-radius: 10px;
    font-family: inherit;
    color: var(--text);
  }
  .goal input:focus { outline: none; border-color: var(--toutoi); }
  .goal-row { display: flex; align-items: flex-end; gap: 10px; }
  .goal-row #goalInput { flex: 1; min-width: 0; }
  .unit-col { width: 96px; flex: none; }
  .unit-col label { text-align: center; margin-bottom: 4px; }
  .goal-row #unitInput { text-align: center; font-size: 18px; }
  .fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; margin-bottom: 12px; background: #efeafb; color: var(--toutoi); border-radius: 12px;
    font-weight: 700; font-size: 14px; user-select: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::after { content: '▲ 閉じる'; font-size: 13px; font-weight: 600; }
  .fold > summary:focus-visible { outline: 3px solid #222; outline-offset: 2px; }
  .fold:not([open]) { margin-bottom: 22px; }
  .fold:not([open]) > summary { margin-bottom: 0; }
  .fold:not([open]) > summary::after { content: '▼ 開く'; }
  .calc {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 4px 12px;
    margin-top: 14px;
    font-size: 14px;
    color: var(--muted);
  }
  .calc b { color: var(--text); font-size: 18px; font-variant-numeric: tabular-nums; }
  .remain {
    margin: 0 0 16px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
  }
  .remain .num { font-size: 40px; color: var(--love); font-variant-numeric: tabular-nums; }
  .remain.done { color: var(--first); }
  .bar {
    position: relative;
    height: 14px;
    background: #e6e0f5;
    border-radius: 999px;
    overflow: hidden;
    margin-top: 10px;
  }
  .bar > .fill {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--plus), var(--love));
    border-radius: 999px;
    transition: width .25s;
  }
  .bar > .tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 4px;
    margin-left: -2px;
    background: var(--mark);
    box-shadow: 0 0 0 2px #e6e0f5;
  }
  .next-wrap { margin-top: 18px; padding-top: 16px; border-top: 2px dashed #e6e0f5; }
  .next-wrap.reached input { border-color: var(--mark); }
  .next-wrap .reached-msg { color: #b86e00; font-weight: 700; }
  .step { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .step button { padding: 20px 8px; font-size: 24px; font-variant-numeric: tabular-nums; touch-action: manipulation; }
  .step .s-minus { background: #fff; color: var(--toutoi); box-shadow: inset 0 0 0 2px var(--toutoi); }
  .step .s-plus { background: var(--toutoi); }
  .catctl { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px;
    padding: 10px 14px; background: #faf8ff; border: 2px solid #e6e0f5; border-radius: 14px; }
  .catctl-label { font-size: 14px; color: var(--muted); }
  .catctl-box { display: flex; align-items: center; gap: 8px; }
  .catctl-box button { background: #efeafb; color: var(--toutoi); padding: 8px 14px; font-size: 18px; border-radius: 10px; touch-action: manipulation; }
  .catctl-box input { width: 76px; text-align: center; font-size: 18px; font-weight: 700; padding: 8px 6px; border: 2px solid #d9d2ee;
    border-radius: 10px; font-family: inherit; color: var(--text); font-variant-numeric: tabular-nums; }
  .catctl-box input:focus { outline: none; border-color: var(--toutoi); }
  .bd-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .cats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
  }
  .cat {
    --c: var(--plus);
    background: #faf8ff;
    border: 2px solid #e6e0f5;
    border-radius: 14px;
    padding: 12px;
    display: grid;
    gap: 8px;
    min-width: 0;
  }
  .cat input {
    width: 100%;
    min-width: 0;
    font-family: inherit;
    color: var(--text);
    border: 2px solid #d9d2ee;
    border-radius: 10px;
    background: #fff;
  }
  .cat input:focus { outline: none; border-color: var(--c); }
  .cat .cname { font-size: 16px; font-weight: 700; padding: 8px 10px; }
  .cat .cgoal { font-size: 15px; padding: 6px 10px; font-variant-numeric: tabular-nums; }
  .cat .cval { font-size: 20px; font-weight: 700; padding: 6px 10px; font-variant-numeric: tabular-nums; }
  .cat .pm { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat .pm button { padding: 18px 4px; font-size: 20px; font-variant-numeric: tabular-nums; white-space: nowrap; touch-action: manipulation; }
  .cat .plus { background: var(--c); }
  .cat .minus { background: #fff; color: var(--c); box-shadow: inset 0 0 0 2px var(--c); }
  .cat .csub { font-size: 13px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .cat .csub b { color: var(--text); font-size: 16px; }
  .breakdown { margin-top: 22px; background: #faf8ff; border: 2px solid #e6e0f5; border-radius: 14px; padding: 14px 16px 8px; }
  .breakdown .bd-title { font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  .bd-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #eee9f8; font-variant-numeric: tabular-nums; }
  .bd-row:first-child { border-top: none; }
  .bd-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--muted); }
  .bd-name { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
  .bd-val { font-weight: 700; font-size: 18px; white-space: nowrap; }
  .bd-val.withgoal { font-size: 16px; }
  .bd-val.pos { color: var(--first); }
  .bd-val.neg { color: #e5484d; }
  .bd-val.zero { color: var(--muted); }
  .bd-row.total { border-top: 2px solid #d9d2ee; margin-top: 4px; }
  .bd-row.total .bd-name { color: var(--muted); font-weight: 700; }
  .bd-row.total .bd-val { font-size: 22px; color: var(--text); }
  .sl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .sl-row .save-btn { background: var(--toutoi); }
  .sl-row .load-btn { background: var(--plus); }
  .reset-wrap { margin-top: 12px; }
  .share {
    margin-top: 22px;
    background: #faf8ff;
    border: 2px solid #e6e0f5;
    border-radius: 14px;
    padding: 16px;
  }
  .share label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
  .share textarea {
    width: 100%;
    height: 110px;
    resize: vertical;
    font-size: 15px;
    line-height: 1.5;
    padding: 10px 12px;
    border: 2px solid #d9d2ee;
    border-radius: 10px;
    font-family: inherit;
    color: var(--text);
  }
  .share textarea:focus { outline: none; border-color: #1d9bf0; }
  .share .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 6px 0 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .share .meta button {
    background: none;
    color: var(--toutoi);
    padding: 4px 6px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 8px;
  }
  .share .count.over { color: #e5484d; font-weight: 700; }
  .tweet { background: #1d9bf0; width: 100%; }
  a.tweet {
    display: block; text-align: center; text-decoration: none; border-radius: 14px; padding: 16px 8px;
    font-size: 17px; font-weight: 700; color: #fff; background: #1d9bf0;
  }
  a.tweet[aria-disabled="true"] { background: #b7c4cf; pointer-events: none; }
  button {
    border: none;
    border-radius: 14px;
    padding: 16px 8px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    transition: transform .08s, filter .15s;
    font-family: inherit;
  }
  button small { display: block; font-size: 13px; font-weight: 500; opacity: .9; margin-top: 2px; }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 3px solid #222; outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  .reset   { background: #6b6780; width: 100%; padding: 12px 8px; }
  .full-reset { background: #b42332; width: 100%; padding: 12px 8px; margin-top: 10px; }
  .armed   { background: #e5484d !important; color: #fff !important; box-shadow: none !important; }

  /* スタート画面 */
  .start h1 { font-size: 28px; margin: 0 0 6px; }
  .start p { margin: 0 0 18px; color: var(--muted); }
  .start .choices { display: grid; gap: 12px; }
  .choice { text-align: left; padding: 16px; background: #6b6780; }
  .choice.main { background: var(--toutoi); }
  .choice b { font-size: 18px; display: block; }

  /* セーブ / ロード */
  .sheet {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(30, 20, 60, .5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .sheet-panel {
    background: #fff;
    width: min(100%, 640px);
    max-height: 92%;
    overflow: auto;
    border-radius: 18px 18px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
    display: grid;
    gap: 12px;
  }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet-head h2 { margin: 0; font-size: 20px; }
  .sheet-head button { background: #efeafb; color: var(--toutoi); padding: 10px 14px; font-size: 14px; border-radius: 10px; }
  .save-name { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  .save-name input {
    font-size: 16px; padding: 10px 12px; border: 2px solid #d9d2ee; border-radius: 10px;
    font-family: inherit; color: var(--text); width: 100%;
  }
  .slots { display: grid; gap: 8px; }
  .slot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 12px; background: #faf8ff; border: 2px solid #e6e0f5; border-radius: 12px;
  }
  .slot-info { flex: 1 1 200px; min-width: 0; }
  .slot-title { font-weight: 700; overflow-wrap: anywhere; }
  .slot-meta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .slot-act { display: flex; gap: 8px; }
  .slot-act button { background: var(--toutoi); padding: 10px 12px; font-size: 15px; min-width: 92px; border-radius: 10px; }
  .newgame { background: #6b6780; width: 100%; padding: 12px 8px; }

  .toast {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center;
    pointer-events: none; padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .toast span {
    background: var(--text); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s;
  }
  .toast.on span { opacity: 1; transform: none; }
</style>

<body>
  <main class="app">

    <!-- スタート画面 -->
    <section class="start" id="startScreen" hidden>
      <h1>集計ツール</h1>
      <p id="startMsg">データを確認しています…</p>
      <div class="choices">
        <button class="choice main" id="bResume" type="button" hidden><b>前回の続きから</b><small id="resumeMeta"></small></button>
        <button class="choice" id="bLoad" type="button" hidden><b>セーブデータを読み込む</b><small id="loadMeta"></small></button>
        <button class="choice" id="bNew" type="button" hidden><b>新しく始める</b><small>目標・名前・変動値を初期状態にします</small></button>
      </div>
    </section>

    <!-- メイン画面 -->
    <div id="mainScreen" hidden>
      <div class="topbar">
        <span class="status" id="status">自動保存 待機中</span>
        <div class="top-btns">
          <button class="small-btn" id="bSaveTop" type="button">セーブ</button>
          <button class="small-btn" id="bLoadTop" type="button">ロード</button>
        </div>
      </div>

      <section class="window" aria-live="polite">
        <div class="label">集計（達成率）</div>
        <div class="value" id="total">-</div>
        <div class="bar" id="bar"><div class="fill" id="barFill"></div></div>
      </section>

      <details class="fold" id="fold" open>
        <summary>目標値・±1ボタン</summary>

        <section class="goal">
          <div class="remain" id="remain">目標を入力してください</div>
          <div class="goal-row">
            <input type="number" id="goalInput" min="0" inputmode="numeric" placeholder="目標を入力" aria-label="目標値">
            <div class="unit-col">
              <label for="unitInput">単位</label>
              <input type="text" id="unitInput" maxlength="8" aria-label="目標値の単位">
            </div>
          </div>
        </section>

        <section class="step" aria-label="カテゴリーの合計を1ずつ調整">
          <button type="button" class="s-minus" id="stepMinus" aria-label="カテゴリーの合計を1減らす">−1</button>
          <button type="button" class="s-plus" id="stepPlus" aria-label="カテゴリーの合計を1増やす">+1</button>
        </section>
      </details>

      <section class="catctl" aria-label="カテゴリー数">
        <span class="catctl-label">カテゴリー数（0〜100）</span>
        <div class="catctl-box">
          <button type="button" id="catMinus" aria-label="カテゴリーを1つ減らす">−</button>
          <input type="number" id="catCount" min="0" max="100" step="1" inputmode="numeric" value="6" aria-label="カテゴリー数">
          <button type="button" id="catPlus" aria-label="カテゴリーを1つ増やす">＋</button>
        </div>
      </section>

      <section class="cats" id="cats" aria-label="カテゴリ"></section>

      <section class="breakdown" aria-label="カテゴリー別の小計">
        <div class="bd-title">カテゴリー別の小計</div>
        <div id="bdList"></div>
      </section>

      <section class="share">
        <label for="tweetText">Xに投稿する内容</label>
        <textarea id="tweetText" placeholder="カテゴリーに「変動値」を設定すると、投稿文が自動で作成されます"></textarea>
        <div class="meta">
          <button type="button" id="regen">自動生成に戻す</button>
          <span class="count" id="count">0 / 280</span>
        </div>
        <a class="tweet" id="tweetBtn" target="_blank" rel="noopener noreferrer">Xで投稿する</a>
      </section>

      <div class="sl-row">
        <button class="save-btn" id="bSave" type="button">セーブ<small>スロットに保存</small></button>
        <button class="load-btn" id="bLoadMain" type="button">ロード<small>保存データを読み込む</small></button>
      </div>

      <div class="reset-wrap">
        <button class="reset" id="reset" type="button">リセット<small>合計を0に戻す（2回押し）</small></button>
        <button class="full-reset" id="fullReset" type="button">完全初期化<small>入力内容・目標・カテゴリー・保存データをすべて削除（2回押し）</small></button>
      </div>
    </div>
  </main>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2 id="sheetTitle">セーブ / ロード</h2>
        <button id="sheetClose" type="button">閉じる</button>
      </div>
      <label class="save-name" id="saveNameRow" for="saveName">セーブ名（任意）
        <input type="text" id="saveName" maxlength="24" placeholder="例: 2日目 夜">
      </label>
      <div class="slots" id="slots"></div>
      <div id="newRow"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastT"></span></div>

<script>
(function () {
  'use strict';
  const KEY = 'shukei-tool-v2';
  const SLOTS = 10;
  const DEF = [1, 2, 3, 4, 5, 6].map(n => ['カテゴリー' + n, 0]);
  const COLORS = ['var(--plus)', 'var(--first)', 'var(--love)', 'var(--toutoi)', 'var(--orange)', 'var(--teal)'];
  const MAXCAT = 100, DEFAULT_N = 6;
  const colorOf = i => i < COLORS.length ? COLORS[i] : 'hsl(' + ((i * 47) % 360) + ' 62% 48%)';
  const $ = id => document.getElementById(id);
  const clone = o => JSON.parse(JSON.stringify(o));
  const toInt = v => { const x = Math.round(Number(v)); return Number.isFinite(x) ? x : 0; };
  const rawNum = v => { if (v === '' || v == null) return ''; const x = Number(v); return Number.isFinite(x) ? String(x) : ''; };
  const fmtTime = ts => new Date(ts).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  /* ---------- データ ---------- */
  function newState() {
    return { goal: '', next: '', total: 0, adj: 0, unit: '', n: DEFAULT_N, manual: false, text: '',
      cats: Array.from({ length: MAXCAT }, (_, i) => ({ name: i < DEF.length ? DEF[i][0] : 'カテゴリー' + (i + 1), val: 0, sum: 0, goal: '' })) };
  }
  function sanitize(s) {
    const d = newState();
    if (!s || typeof s !== 'object') return d;
    const o = { goal: rawNum(s.goal), next: rawNum(s.next), total: 0, adj: toInt(s.adj), unit: typeof s.unit === 'string' ? s.unit.slice(0, 8) : '',
      manual: !!s.manual, text: typeof s.text === 'string' ? s.text.slice(0, 1000) : '', cats: [] };
    for (let i = 0; i < MAXCAT; i++) {
      const c = (s.cats && s.cats[i]) || {};
      o.cats.push({
        name: typeof c.name === 'string' ? c.name.slice(0, 20) : d.cats[i].name,
        val: c.val == null ? d.cats[i].val : Math.abs(toInt(c.val)),
        sum: toInt(c.sum),
        goal: rawNum(c.goal)

    }
    // カテゴリー数（古いセーブデータは、保存されていたカテゴリー数をそのまま使う）
    const nRaw = s.n == null ? (Array.isArray(s.cats) ? s.cats.length : DEFAULT_N) : toInt(s.n);
    o.n = Math.max(0, Math.min(MAXCAT, nRaw));

  }
  function normStore(x) {
    const o = { auto: null, slots: Array(SLOTS).fill(null) };
    if (!x || typeof x !== 'object') return o;
    if (x.auto && x.auto.state) o.auto = { state: sanitize(x.auto.state), savedAt: Number(x.auto.savedAt) || 0 };
    for (let i = 0; i < SLOTS; i++) {
      const s = x.slots && x.slots[i];
      if (s && s.state) o.slots[i] = { state: sanitize(s.state), savedAt: Number(s.savedAt) || 0, label: typeof s.label === 'string' ? s.label.slice(0, 24) : '' };
    }

  }
  let store = normStore(null);
  let state = newState();
  let changed = false;
  let storageOK = true;
  const hasData = () => !!store.auto || store.slots.some(Boolean);

  function readLS() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
  function writeLS() {
    try { localStorage.setItem(KEY, JSON.stringify(store)); storageOK = true; } catch (e) { storageOK = false; }
    scheduleRemote();
  }
  /* アカウントのデータベース(使える環境のみ)にも保存して、端末が変わっても続きから使えるようにする */
  let dbDoc = null, remoteTimer = 0, remoteBusy = false, remoteDirty = false;
  function scheduleRemote() {
    if (!dbDoc) return;

  }
  async function pushRemote() {
    if (!dbDoc) return;
    if (remoteBusy) { remoteDirty = true; return; }
    remoteBusy = true;
    try { await dbDoc.set({ v: 1, json: JSON.stringify(store) }); } catch (e) {}
    remoteBusy = false;
    if (remoteDirty) { remoteDirty = false; scheduleRemote(); }
  }
  const newer = (x, y) => !x ? y : !y ? x : (y.savedAt > x.savedAt ? y : x);
  function mergeStore(a, b) {
    const o = normStore(null);
    o.auto = newer(a.auto, b.auto);

    return o;
  }
  async function initRemote() {
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return false;
      const id = await user.id();
      if (!id) return false;
      dbDoc = db.doc('data/users/' + id + '/app');
      const snap = await dbDoc.get();
      if (snap.exists) {
        const d = snap.data();
        if (d && typeof d.json === 'string') { store = mergeStore(store, normStore(JSON.parse(d.json))); try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
      }
      return true;
    } catch (e) { dbDoc = null; return false; }
  }
  function setStatus() {

    el.classList.remove('warn');
    el.textContent = store.auto ? '自動保存 ' + new Date(store.auto.savedAt).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '自動保存 待機中';
  }
  function autoSave() { store.auto = { state: clone(state), savedAt: Date.now() }; writeLS(); setStatus(); }
  function markChanged() { changed = true; autoSave(); }

  /* ---------- 共通 ---------- */
  let toastTimer = 0;
  function toast(msg) {
    $('toastT').textContent = msg; $('toast').classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('on'), 2200);
  }
  function disarm(btn) { clearTimeout(btn._t); btn.classList.remove('armed'); if (btn._orig != null) btn.innerHTML = btn._orig; }
  function arm(btn, armedText, fn) {
    btn.addEventListener('click', () => {
      if (btn.classList.contains('armed')) { disarm(btn); fn(); return; }
      btn._orig = btn.innerHTML; btn.textContent = armedText; btn.classList.add('armed');
      btn._t = setTimeout(() => disarm(btn), 3500);
    });
    return btn;
  }
  function summary(e) {
    const g = e.state.goal === '' ? '未設定' : e.state.goal;
    return '合計 ' + e.state.total + ' / 目標 ' + g + ' ・ ' + fmtTime(e.savedAt);
  }

  /* ---------- 表示（集計・目標・次の小計） ---------- */
  const totalEl = $('total'), remainEl = $('remain'), barFill = $('barFill');

  // 表示中（先頭からn個）のカテゴリーだけを合計に含める
  const catSum = () => state.cats.slice(0, state.n).reduce((a, c) => a + c.sum, 0);
  // 「変動値」が設定されているカテゴリー（増減が残っているものも含む）だけを一覧・投稿文に出す
  const isActive = c => c.val > 0 || c.sum !== 0;
  // カテゴリーの合計 = 各カテゴリーの増減の合計 + ±1ボタンの調整分（操作のたびに自動で再計算）
  const syncTotal = () => { state.total = catSum() + state.adj; return state.total; };
  const fmtSigned = n => n > 0 ? '+' + n : n < 0 ? '−' + (-n) : '0';
  // 達成率(%)。目標が空のときは null
  function pctOf(sum, goal) {
    if (goal === '' || goal == null) return null;
    const g = Number(goal);
    return g > 0 ? sum / g * 100 : (sum >= 0 ? 100 : 0);
  }
  function fmtPct(p) { return (Math.round(p * 10) / 10) + '%'; }
  // カテゴリー別の小計一覧（操作・名前変更のたびに更新）
  function renderBreakdown() {
    const host = $('bdList');
    host.textContent = '';
    // goal が空でなければ「小計 / 目標（達成率）」、空なら小計のみ
    const row = (name, val, color, cls, goal) => {
      const hasGoal = goal !== undefined && goal !== '';
      const r = document.createElement('div'); r.className = 'bd-row' + (cls ? ' ' + cls : '');
      const d = document.createElement('span'); d.className = 'bd-dot'; if (color) d.style.background = color;
      const n = document.createElement('span'); n.className = 'bd-name'; n.textContent = name;
      const v = document.createElement('span');
      v.className = 'bd-val ' + (cls === 'total' ? '' : val > 0 ? 'pos' : val < 0 ? 'neg' : 'zero') + (hasGoal ? ' withgoal' : '');
      v.textContent = hasGoal ? val + ' / ' + Number(goal) + '（' + fmtPct(pctOf(val, goal)) + '）' : fmtSigned(val);
      if (cls !== 'total') r.appendChild(d);
      r.appendChild(n); r.appendChild(v); host.appendChild(r);
    };
    let shown = 0;
    for (let i = 0; i < state.n; i++) {
      const c = state.cats[i];
      if (!isActive(c)) continue;
      row(c.name || 'カテゴリー' + (i + 1), c.sum, colorOf(i), '', c.goal); shown++;
    }
    if (!shown && state.adj === 0) {
      const e = document.createElement('div'); e.className = 'bd-empty';
      e.textContent = '「変動値」を設定したカテゴリーがここに表示されます';

  }
  // 達成率(%)。目標未設定のときは null
  const rate = () => {

  function render(bump) {

    updateTweet();
  }
  function renderGoal() {
    const total = state.total;
    const pct = rate();
    totalEl.textContent = pct === null ? '-' : (Math.round(pct * 10) / 10) + '%';
    totalEl.classList.toggle('negative', pct !== null && pct < 0);

      const goal = Number(state.goal);

      else {
        remainEl.className = 'remain'; remainEl.textContent = '目標達成まであと ';

        remainEl.appendChild(document.createTextNode(state.unit ? ' ' + state.unit : ''));
      }
      barFill.style.width = (goal > 0 ? Math.max(0, Math.min(100, (total / goal) * 100)) : 100) + '%';
    }
  }

  /* ---------- カテゴリ ---------- */
  const refs = [];
  (function buildCats() {
    const host = $('cats');
    for (let i = 0; i < MAXCAT; i++) {
      const el = document.createElement('div');
      el.className = 'cat';
      el.hidden = i >= state.n;
      el.style.setProperty('--c', colorOf(i));
      el.innerHTML = '<input class="cname" id="cname' + i + '" type="text" maxlength="20" aria-label="カテゴリー' + (i + 1) + 'の名前">'
        + '<input class="cval" id="cval' + i + '" type="number" inputmode="numeric" min="0" step="1" placeholder="変動値" aria-label="カテゴリー' + (i + 1) + 'の変動値">'
        + '<input class="cgoal" id="cgoal' + i + '" type="number" inputmode="numeric" min="0" step="1" placeholder="目標（任意）" aria-label="カテゴリー' + (i + 1) + 'の目標">'
        + '<div class="pm"><button type="button" class="minus" id="cm' + i + '"></button><button type="button" class="plus" id="cp' + i + '"></button></div>'
        + '<div class="csub" id="csub' + i + '"></div>';
      host.appendChild(el);
      const r = { name: $('cname' + i), val: $('cval' + i), goal: $('cgoal' + i), minus: $('cm' + i), plus: $('cp' + i), sub: $('csub' + i), el: el };
      refs.push(r);
      r.name.addEventListener('input', () => { state.cats[i].name = r.name.value; renderCat(i); markChanged(); renderBreakdown(); updateTweet(); });
      r.val.addEventListener('input', () => { state.cats[i].val = Math.abs(toInt(r.val.value)); renderCat(i); markChanged(); renderBreakdown(); updateTweet(); });
      r.val.addEventListener('change', () => { r.val.value = state.cats[i].val || ''; });
      [r.name, r.val, r.goal].forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); }));
      r.goal.addEventListener('input', () => { state.cats[i].goal = rawNum(r.goal.value); renderCat(i); renderBreakdown(); updateTweet(); markChanged(); });
      r.minus.addEventListener('click', () => press(i, -1));
      r.plus.addEventListener('click', () => press(i, 1));
    }
  })();
  function renderCat(i) {
    const c = state.cats[i], r = refs[i], n = c.name || 'カテゴリー' + (i + 1);
    r.minus.textContent = '−' + (c.val || ''); r.plus.textContent = '+' + (c.val || '');
    // 桁数が多いときは文字を縮めて、ボタン内で折り返さないようにする
    const fs = Math.max(11, 20 - Math.max(0, String(c.val || '').length - 6) * 2) + 'px';
    r.minus.style.fontSize = fs; r.plus.style.fontSize = fs;
    r.sub.innerHTML = '合計 <b>' + fmtSigned(c.sum) + '</b>'

  }

  /* ---------- カテゴリー数（0〜100） ---------- */
  function applyCount() {

    $('catCount').value = state.n;
  }
  function setCount(v) {
    v = Math.max(0, Math.min(MAXCAT, toInt(v)));

    // 減らしたカテゴリーのデータは消さずに保持（増やすと元に戻る）。ただし合計には含めない

  }

  $('catPlus').addEventListener('click', () => setCount(state.n + 1));

  arm($('reset'), 'もう一度押すとリセット', () => {
    state.adj = 0; state.cats.forEach(c => { c.sum = 0; }); syncTotal();

    state = newState();
    store = normStore(null);
    changed = false;

    try { localStorage.removeItem(KEY); } catch (e) { storageOK = false; }

    clearTimeout(remoteTimer);
    remoteDirty = false;

  /* ---------- X(Twitter)投稿 ---------- */
  const tweetText = $('tweetText'), countEl = $('count'), tweetBtn = $('tweetBtn');
  function buildText() {
    // 目標値あり：目標達成率＋残り＋【内訳】。目標値なし：増減が入力されたカテゴリーだけを並べる
    const lines = [];
    const hasGoal = state.goal !== '';
    if (hasGoal) {
      const goal = Number(state.goal), rest = goal - state.total, u = state.unit;
      lines.push('目標達成率：' + fmtPct(pctOf(state.total, state.goal)) + '（' + state.total + '/' + goal + u + '）');
      lines.push(rest <= 0 ? '目標達成！🎉' : '目標達成まであと' + rest + u);
    }
    // 内訳：「変動値」が設定されたカテゴリーを、小計が±0・マイナスでもすべて載せる。
    // 目標のあるカテゴリーは「小計/目標（達成率）」、ないカテゴリーは小計のみ。
    // 280字を超えそうなら、入る分までを載せて末尾を「…他N件」にまとめる。
    const det = [];
    for (let i = 0; i < state.n; i++) {
      const c = state.cats[i];
      if (isActive(c)) det.push({ n: c.name || 'カテゴリー' + (i + 1), s: c.sum, g: c.goal });
    }
    if (hasGoal && state.adj !== 0) det.push({ n: '調整', s: state.adj, g: '' });
    if (det.length) {
      if (hasGoal) lines.push('【内訳】');
      let omitted = 0;
      det.forEach(x => {
        const line = x.n + ' ' + (x.g === '' ? fmtSigned(x.s) : x.s + '/' + Number(x.g) + '（' + fmtPct(pctOf(x.s, x.g)) + '）');
        if (!omitted && weightedLength(lines.join('\n') + '\n' + line) <= 272) lines.push(line); else omitted++;
      });
      if (omitted) lines.push('…他' + omitted + '件');
    }
    return lines.join('\n');
  }
  // Xの重み付けカウント（半角=1、全角=2）の簡易版
  function weightedLength(s) {

    return n;
  }
  function updateCount() {
    const n = weightedLength(tweetText.value);
    countEl.textContent = n + ' / 280';
    countEl.classList.toggle('over', n > 280);
    if (n === 0 || n > 280) { tweetBtn.removeAttribute('href'); tweetBtn.setAttribute('aria-disabled', 'true'); }

  }

    if (isMain) {
      const b = mkBtn('新しく始める'); b.className = 'newgame';
      arm(b, '現在のデータを初期化する？', () => { state = newState(); changed = true; autoSave(); closeSheet(); renderAll(); toast('新しく始めました'); });
      nr.appendChild(b);
    }
  }
  $('sheetClose').addEventListener('click', closeSheet);
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });

  /* ---------- アプリを閉じる時の保存 ---------- */
  function flush() {
    if (changed && !$('mainScreen').hidden) autoSave();
    clearTimeout(remoteTimer); pushRemote();
  }
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  /* ---------- 起動 ---------- */
  store = normStore(readLS());
  try { localStorage.setItem(KEY + '-t', '1'); localStorage.removeItem(KEY + '-t'); } catch (e) { storageOK = false; }
  const remoteP = initRemote().then(ok => { if (ok && hasData()) scheduleRemote(); return ok; });
  showScreen('start');
  if (hasData()) {
    renderStart(false);
    remoteP.then(() => { if (!$('startScreen').hidden) renderStart(false); });
  } else {
    renderStart(true);
    Promise.race([remoteP, new Promise(r => setTimeout(r, 2500))]).then(() => {
      if ($('startScreen').hidden) return;
      if (hasData()) renderStart(false); else startNew();
    });
  }
})();
</script>
</body>
</html>
